[mypy]
strict = True
disallow_any_explicit = True
python_version = 3.12
no_site_packages = True
follow_imports = error
namespace_packages = True
explicit_package_bases = True
show_column_numbers = True
show_error_codes = True
show_absolute_path = True
show_error_context = False
pretty = False
color_output = False
error_summary = False
incremental = False

# Nagini's contract package is a typed ghost API. Its runtime bodies intentionally use `pass`
# because they are interpreted by the verifier, not executed. We retain its declared signatures
# but do not diagnose those deliberately bodyless implementations as application source errors.
[mypy-nagini_contracts.*]
ignore_errors = True
